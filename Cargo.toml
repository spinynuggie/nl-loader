[package]
name = "neverlose-launcher"
version = "2.0.0-alpha.1"
edition = "2021"
description = "Neverlose Launcher - native GPUI client"
license = "GPL-3.0"
default-run = "neverlose-launcher"

[[bin]]
name = "neverlose-launcher"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
base64 = "0.22"
chrono = "0.4"
gpui = "0.2.2"
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp"] }
keyvalues-parser = "0.2"
raw-window-handle = "0.6"
reqwest = { version = "0.12", features = ["json"] }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "net", "time"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
